<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="elab.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel = "stylesheet" href = "https://fonts.googleapis.com/css2?family=Staatliches&display=swap">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Staatliches&display=swap">
    <title>ELAB | Order History</title>
</head>
<body>



<!--Navigation Bar-->

    <nav class="navbar">
        <a class="anav">ELAB</a>
    <ul class="menu">
        <li class="navtext"><a href="owner.html">HOME</a></li>
    </ul>
    </nav>





<!--Center Page Text-->

<h1 class="helabtle">ORDER HISTORY</h1>
<p class="pelabtle"> This page displays user's order history. Please note order history gets cleared every 2 months</p>
    




<!--Order History Content-->

<div class="list-container">
    <table class="order-table">
        <thead>
            <tr>
                <th>TIME</th>
                <th>CUSTOMER</th>
                <th>PHONE</th>
                <th>TOTAL</th>
                <th>PROOF</th>
                <th>STATUS</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody id="history-list"></tbody>
    </table>
</div>






<!--JAVASCRIPT-->


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAVTxC5DoJs4apNkUEp6HgqJMOdNi_2Umw",
    authDomain: "elab-orders.firebaseapp.com",
    projectId: "elab-orders",
    databaseURL: "https://elab-orders-default-rtdb.asia-southeast1.firebasedatabase.app/" 
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Use 'orders' because that's where the customer sent the data!
const ordersRef = ref(db, 'orders'); 

onValue(ordersRef, (snapshot) => {
    const data = snapshot.val();
    console.log("Checking for orders in 'orders' folder:", data);
    
    const listBody = document.getElementById('history-list');
    listBody.innerHTML = ""; 

    if (!data) {
        listBody.innerHTML = "<tr><td colspan='6'>No orders found in database.</td></tr>";
        return;
    }

    let completedFound = 0;

    Object.keys(data).reverse().forEach(id => {
        const order = data[id];

        // This filter handles the separation for you
        if (order.status === "Completed" || order.status === "Rejected") {
            completedFound++;
            const statusLabel = order.status === 'Completed'
                ? '<span style="color: #39ff14; font-size: 0.8rem;">DONE</span>'
                : '<span style="color: #ff4444; font-size: 0.8rem;">REJECTED</span>';
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${order.time || 'N/A'}</td>
                <td style="color: #ffcc00; font-weight: bold;">${order.name || 'N/A'}</td>
                <td>${order.phone || 'N/A'}</td>
                <td>₱${order.total || '0'}</td>
                <td>
                    <img src="${order.proofOfPayment}" 
                         class="list-img" 
                         onclick="window.showFullImage(this.src)">
                </td>
                <td>${statusLabel}</td>
                <td><button class="delete-btn" onclick="deleteOrderForever('${id}')">DELETE</button></td>
            `;
            listBody.appendChild(row);
        }
    });

    if (completedFound === 0) {
        listBody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>No completed or rejected orders yet.</td></tr>";
    }
});

window.showFullImage = (src) => {
    const newWin = window.open('', '_blank');
    if (!newWin) return alert('Popup blocked. Please allow popups for this site.');
    newWin.document.write(`<img src="${src}" style="width:100%; height:auto;">`);
};

window.deleteOrderForever = (id) => {
    // Always ask for confirmation before a permanent delete!
    if (confirm("PROCEED WITH CAUTION: This will permanently erase this order from ELAB's database. Continue?")) {
        const orderRef = ref(db, `orders/${id}`);
        
        remove(orderRef)
            .then(() => {
                console.log("Order erased successfully.");
            })
            .catch((error) => {
                alert("Error deleting order: " + error.message);
            });
    }
};
</script>
</body>
</html>
